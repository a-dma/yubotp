[package]
name = "yubotp"
version = "0.1.0"
authors = [
    "Alessio Di Mauro <alessio@alessiodimauro.com>",
    "Alessandro Carlo Chirico <alessandro.carlo@chiri.co>"
]
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-rt = "2.11.0"
actix-web = { version = "4.11.0", features = ["openssl"] }
awc = { version = "3.8.0", features = ["openssl"] }
base64 = "0.22.1"
bytes = "1.10.1"
config = "0.15.18"
env_logger = "0.11.8"
hex = "0.4.3"
hmac = "0.12.1"
log = "0.4.28"
rand = "0.9.2"
regex = "1.11.3"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
sha-1 = "0.10.1"
sha2 = "0.10.9"
tokio = "1.47.1"
